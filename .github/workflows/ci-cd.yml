name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t node-cicd-pipeline:${{ github.sha }} .

      - name: Start container and check /health
        run: |
          docker run -d -p 8080:3000 --name app node-cicd-pipeline:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
